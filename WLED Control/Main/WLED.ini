[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=WLED Control
Author=wled-Rainmeter-pro
Information=Full WLED controller with auto-discovery: power, brightness, 3 colour slots, effects with per-effect controls, palettes, segments, presets, nightlight, sync.
Version=3.0
License=MIT

[Variables]
@Include=#@#Variables.inc
Name=WLED
Sub=Starting...
DevLabel=Starting...
PowerCol=70,70,90
Fbri=0
TxtBri=BRIGHTNESS

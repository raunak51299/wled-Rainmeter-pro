; ============================================================ Styles
[sHid]
Hidden=1

[sLabel]
FontFace=Segoe UI Semibold
FontColor=#ColDim#
FontSize=8
AntiAlias=1
DynamicVariables=1

[sText]
FontFace=Segoe UI
FontColor=#ColText#
FontSize=10
AntiAlias=1
DynamicVariables=1

[sBtn]
FontFace=Segoe UI Semibold
FontColor=#ColText#
FontSize=10
StringAlign=CenterCenter
SolidColor=#ColBtn#
AntiAlias=1
H=28
ClipString=1
DynamicVariables=1
MouseOverAction=[!SetOption #CURRENTSECTION# SolidColor "#ColAccent#"][!UpdateMeter #CURRENTSECTION#][!Redraw]
MouseLeaveAction=[!SetOption #CURRENTSECTION# SolidColor "#ColBtn#"][!UpdateMeter #CURRENTSECTION#][!Redraw]

[sTog]
FontFace=Segoe UI Semibold
FontColor=#ColText#
FontSize=9
StringAlign=CenterCenter
AntiAlias=1
H=28
ClipString=1
DynamicVariables=1

[sBar]
Meter=Shape
DynamicVariables=1
Shape=Rectangle 0,0,328,14,7 | Fill Color #ColTrack# | StrokeWidth 0

; ============================================================ Measures
[State]
Measure=WebParser
URL=http://#IP#/json/si
Download=1
DownloadFile=state.json
UpdateRate=#PollSeconds#
DynamicVariables=1
OnConnectErrorAction=[!CommandMeasure Script "SetOffline()"]
OnDownloadErrorAction=[!CommandMeasure Script "SetOffline()"]

[Eff]
Measure=WebParser
URL=http://#IP#/json/eff
Download=1
DownloadFile=eff.json
UpdateRate=3600
DynamicVariables=1

[Pal]
Measure=WebParser
URL=http://#IP#/json/pal
Download=1
DownloadFile=pal.json
UpdateRate=3600
DynamicVariables=1

[FxData]
Measure=WebParser
URL=http://#IP#/json/fxdata
Download=1
DownloadFile=fxdata.json
UpdateRate=3600
DynamicVariables=1

[Presets]
Measure=WebParser
URL=http://#IP#/presets.json
Download=1
DownloadFile=presets.json
UpdateRate=120
DynamicVariables=1

[Script]
Measure=Script
ScriptFile=#@#WLED.lua

[InputIP]
Measure=Plugin
Plugin=InputText
X=112
Y=66
W=170
H=28
FontFace=Segoe UI
FontSize=11
FontColor=255,255,255
SolidColor=30,30,44
DefaultValue=#IP#
FocusDismiss=1
Command1=[!CommandMeasure Script "SetIP('$UserInput$')"]

[InputHex]
Measure=Plugin
Plugin=InputText
X=16
Y=244
W=328
H=28
FontFace=Segoe UI
FontSize=11
FontColor=255,255,255
SolidColor=30,30,44
DefaultValue=#Hex#
FocusDismiss=1
Command1=[!CommandMeasure Script "SetHex('$UserInput$')"]

; ============================================================ Background + header
[Background]
Meter=Shape
Shape=Rectangle 0,0,360,640,14 | Fill Color #ColBG# | StrokeWidth 1 | Stroke Color 255,255,255,30

[Title]
Meter=String
MeterStyle=sText
X=16
Y=12
W=270
ClipString=1
FontSize=15
FontFace=Segoe UI Semibold
Text=#Name#

[SubTitle]
Meter=String
MeterStyle=sLabel
X=16
Y=38
W=270
ClipString=1
Text=#Sub#

[Power]
Meter=Shape
X=308
Y=10
Shape=Ellipse 18,18,17 | Fill Color #PowerCol# | StrokeWidth 0
Shape2=Ellipse 18,19,7 | Fill Color 0,0,0,0 | StrokeWidth 2 | Stroke Color 255,255,255
Shape3=Rectangle 14,9,8,9 | Fill Color #PowerCol# | StrokeWidth 0
Shape4=Rectangle 16.8,8,2.4,11,1.2 | Fill Color 255,255,255 | StrokeWidth 0
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure Script "Toggle()"]
ToolTipText=Power on/off

; ============================================================ Device row
[DevPrev]
Meter=String
MeterStyle=sBtn
X=32
Y=80
W=32
Text=<
LeftMouseUpAction=[!CommandMeasure Script "StepDevice(-1)"]
ToolTipText=Previous device

[DevNext]
Meter=String
MeterStyle=sBtn
X=68
Y=80
W=32
Text=>
LeftMouseUpAction=[!CommandMeasure Script "StepDevice(1)"]
ToolTipText=Next device

[DevText]
Meter=String
MeterStyle=sText
X=112
Y=71
W=180
ClipString=1
Text=#DevLabel#
ToolTipText=Click to type an IP / hostname
LeftMouseUpAction=[!CommandMeasure InputIP "ExecuteBatch 1"]

[Scan]
Meter=String
MeterStyle=sBtn
X=314
Y=80
W=60
Text=Scan
LeftMouseUpAction=[!CommandMeasure Script "StartScan()"]
ToolTipText=Search the local network for WLED devices

